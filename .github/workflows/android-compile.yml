# Manual debug compilation; optional one-day debug APK artifact. No installation.
name: Android Compile Check

on:
  workflow_dispatch:
    inputs:
      save_debug_apk:
        description: "Save the debug APK for local testing (one-day retention)"
        type: boolean
        required: false
        default: false
  # Reused only by the existing manual iOS Compile Check entry point, so a
  # feature branch can be validated before this new workflow reaches main.
  workflow_call:
    inputs:
      save_debug_apk:
        description: "Save the debug APK for local testing (one-day retention)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-compile
  cancel-in-progress: false

jobs:
  compile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      SKIP_ZREMOTE_SWIFT_VERSION: "6.3.3"
      CONFIGURATION: Debug
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then sudo xcode-select -s /Applications/Xcode_26.app; fi
          xcodebuild -version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
          cache-disabled: true
      - name: Install verified Android command-line tools
        run: |
          sdk="$RUNNER_TEMP/zremote-android-sdk"
          download="$RUNNER_TEMP/zremote-android-tools"
          mkdir -p "$sdk/cmdline-tools" "$download"
          case "$(uname -m)" in
            arm64) platform=mac_arm64; checksum=835b62a26162b229b441d1f6d4680383815a270809eb33522c0d480fa5002c4e ;;
            x86_64) platform=mac_x86_64; checksum=c5a6378ab5cf7e0d5701921405115befff13e9ff7417fb588389338f8bd050f3 ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-${platform}-15859902_latest.zip" \
            --output "$download/tools.zip"
          printf '%s  %s\n' "$checksum" "$download/tools.zip" | shasum -a 256 --check
          unzip -q "$download/tools.zip" -d "$download"
          mv "$download/cmdline-tools" "$sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform and build tools
        run: |
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers.txt"
          sdkmanager --licenses < "$RUNNER_TEMP/android-license-answers.txt" > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install pinned Skip and Swift toolchain manager
        run: |
          bash scripts/install-ci-skip.sh
          brew install swiftly
          swiftly init --skip-install --assume-yes --quiet-shell-followup
      - name: Install matching Swift Android SDK and NDK
        run: |
          # Keep the published 6.3.3 pair and verified r27d sysroot; retry only
          # transient download timeouts before continuing to compilation.
          bash scripts/install-android-toolchain.sh
      - name: Install pinned Rust Android tooling
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          echo "CARGO_TARGET_DIR=$HOME/.cache/ZRemote/cache/cargo" >> "$GITHUB_ENV"
          echo "CARGO_CACHE_RELATIVE=$(python3 -c 'import os; print(os.path.relpath(os.path.expanduser("~/.cache/ZRemote/cache/cargo"), "native/core"))')" >> "$GITHUB_ENV"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-core-mobile-v2
          workspaces: "native/core -> ${{ env.CARGO_CACHE_RELATIVE }}"
          cache-on-failure: true
      - name: Install pinned cargo-ndk
        run: |
          python3 scripts/run-local.py --phase rust -- \
            cargo install cargo-ndk --version 4.1.2 --locked --jobs 1
      - name: Compile debug app and verify dependency notices
        run: |
          set -o pipefail
          bash scripts/build-android.sh 2>&1 | tee android-build.log
      - name: Save debug APK for explicitly requested local testing
        if: success() && inputs.save_debug_apk
        uses: actions/upload-artifact@v4
        with:
          name: zremote-debug-apk
          path: Android/app/build/outputs/apk/debug/**/*.apk
          retention-days: 1
          if-no-files-found: error

      - name: Export standalone sources for requested local Android assembly
        if: success() && inputs.save_debug_apk
        run: |
          skip export --no-build --no-ios --no-android --debug --dir "$RUNNER_TEMP/zremote-export"
          test -f "$RUNNER_TEMP/zremote-export/ZRemote-project.zip"
      - name: Save standalone sources for requested local Android assembly
        if: success() && inputs.save_debug_apk
        uses: actions/upload-artifact@v4
        with:
          name: zremote-standalone-sources
          path: ${{ runner.temp }}/zremote-export/ZRemote-project.zip
          retention-days: 1
          if-no-files-found: error
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-build-log
          path: android-build.log
          if-no-files-found: ignore
