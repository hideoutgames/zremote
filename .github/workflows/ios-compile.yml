# Manual native compilation: unsigned iOS, with optional Android debug artifact.
name: iOS Compile Check

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to compile"
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
          - both
      save_debug_apk:
        description: "Save an Android debug APK for local testing (one-day retention)"
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      platform:
        description: "Platform to compile"
        type: string
        required: false
        default: ios
      save_debug_apk:
        description: "Save an Android debug APK for local testing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  compile:
    # Reusable workflows inherit the original caller's event. Refuse app builds
    # from automatic callers as well as keeping this entry point manual-only.
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'android'
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then sudo xcode-select -s /Applications/Xcode_26.app; fi
          xcodebuild -version
      - name: Install pinned Skip and native toolchain
        run: |
          bash scripts/install-ci-skip.sh
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          echo "CARGO_TARGET_DIR=$HOME/.cache/ZRemote/cache/cargo" >> "$GITHUB_ENV"
          echo "CARGO_CACHE_RELATIVE=$(python3 -c 'import os; print(os.path.relpath(os.path.expanduser("~/.cache/ZRemote/cache/cargo"), "native/core"))')" >> "$GITHUB_ENV"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Restore shared iOS Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Reuse the existing main-branch TestFlight cache on either entry point.
          shared-key: ios-core-mobile-dist-v2-testflight
          workspaces: "native/core -> ${{ env.CARGO_CACHE_RELATIVE }}"
          cache-on-failure: true
      - name: Build native client core
        timeout-minutes: 120
        env:
          CONFIGURATION: Release
        run: |
          set -euo pipefail
          bash scripts/build-native-core.sh ios 2>&1 | tee native-core.log
      - name: Resolve Swift packages
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -quiet -workspace Project.xcworkspace \
            -scheme "ZRemote App" -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages" \
            2>&1 | tee package-resolve.log
      - name: Generate and verify acknowledgements
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 scripts/generate-swift-notices.py \
            --resolved Project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            --checkouts "$RUNNER_TEMP/swift-packages/checkouts" --output Sources/ZRemote/Resources \
            2>&1 | tee acknowledgements.log
          python3 scripts/verify-notices.py --required swift,cargo \
            --resolved Project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            2>&1 | tee -a acknowledgements.log
      - name: Build unsigned Release
        timeout-minutes: 60
        run: |
          set -o pipefail
          python3 scripts/run-local.py --phase ios -- \
            xcodebuild -jobs 1 -workspace Project.xcworkspace -scheme "ZRemote App" \
              -skipPackagePluginValidation -skipMacroValidation \
              -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              SKIP_ACTION=none ZREMOTE_APP_BUNDLE_IDENTIFIER=dev.zremote.compilecheck \
              build -quiet 2>&1 | tee build.log
      - name: Save resolved dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dependency-evidence
          path: |
            Project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            Sources/ZRemote/Resources/SwiftAcknowledgements.json
            Sources/ZRemote/Resources/Licenses/Swift-*.txt
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-build-log
          path: |
            native-core.log
            package-resolve.log
            acknowledgements.log
            build.log
          if-no-files-found: ignore

  android:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'android' || inputs.platform == 'both')
    uses: ./.github/workflows/android-compile.yml
    with:
      save_debug_apk: ${{ inputs.save_debug_apk }}
