# iOS TestFlight — unsigned archive + App Store Connect upload via the ASC
# API key. Manual only (workflow_dispatch); merges to main and tag pushes
# do not start it. Archive is unsigned (CODE_SIGNING_ALLOWED=NO) so
# ephemeral runners never mint Apple Development certificates. Export
# cloud-signs with the team's one Apple Distribution certificate.
# Requires repo secrets ASC_KEY_ID / ASC_ISSUER_ID /
# ASC_PRIVATE_KEY (the .p8 file contents, pasted as-is; base64 also
# accepted) / APPLE_TEAM_ID. Optional variable IOS_BUNDLE_ID (default
# no.hideout.zremote). See docs/TESTFLIGHT.md.
#
# The Xcode "Rust core" phase builds crates/mobile during the archive
# (scripts/ios/build-core.sh). Rust must be on PATH before xcodebuild.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (informational only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Record revision
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          {
            echo "## TestFlight revision"
            echo "- SHA: \`$sha\`"
            echo "- Subject: $subject"
            echo "- Build number: \`${{ github.run_number }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Bundle id: \`${{ vars.IOS_BUNDLE_ID || 'no.hideout.zremote' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Archiving $short — $subject (build ${{ github.run_number }})"

      - name: Check required secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            val="${!name:-}"
            if [ -z "$val" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required repository secrets:$missing"
            echo "Configure them under Settings → Secrets and variables → Actions (docs/TESTFLIGHT.md)."
            exit 1
          fi

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: Rust toolchain + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-core
          cache-on-failure: true

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # Accept the .p8 pasted as-is (PEM text) or base64-encoded.
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey.p8"
          case "$ASC_PRIVATE_KEY" in
            *"-----BEGIN "*) printf '%s\n' "$ASC_PRIVATE_KEY" > "$key" ;;
            *) echo "$ASC_PRIVATE_KEY" | base64 --decode > "$key" ;;
          esac
          chmod 600 "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "ASC_PRIVATE_KEY is not a valid .p8"; exit 1; }

      - name: Archive (unsigned)
        working-directory: apps/ios
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'no.hideout.zremote' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Unsigned on purpose: Automatic archive on Xcode 26 still asks
          # for Apple Development certs/profiles. -allowProvisioningUpdates
          # then mints a new development cert on each runner until the
          # team's 3-certificate cap. Export (below) is the only step that
          # talks to Apple for signing — it reuses the one cloud-managed
          # Distribution cert.
          # The Zeron target's "Rust core" phase builds libzeron_mobile.a.
          xcodebuild -project Zeron.xcodeproj -scheme Zeron \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZRemote.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive 2>&1 | tee build.log || {
              grep -E "error:" build.log || true
              exit 1
            }

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export + upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee apps/ios/export.log || {
              grep -E "error:" apps/ios/export.log || true
              exit 1
            }

      - name: Cleanup key material + guard logs
        if: always()
        run: |
          # Belt and braces: the logs must never contain key material. If
          # they do, delete them so the artifact upload below has nothing
          # to leak, then fail the job loudly.
          if grep -lE "BEGIN (EC |RSA )?PRIVATE KEY" apps/ios/build.log apps/ios/export.log 2>/dev/null; then
            echo "Log file contains key material — deleting logs and failing."
            rm -f apps/ios/build.log apps/ios/export.log
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/asc"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            apps/ios/build.log
            apps/ios/export.log
          if-no-files-found: ignore
