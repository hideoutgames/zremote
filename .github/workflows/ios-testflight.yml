# iOS TestFlight — unsigned archive + App Store Connect upload via the ASC
# API key. Manual only (workflow_dispatch); merges to main and tag pushes
# do not start it. Archive is unsigned (CODE_SIGNING_ALLOWED=NO) so
# ephemeral runners never mint Apple Development certificates. Export
# cloud-signs with the team's one Apple Distribution certificate.
# Requires repo secrets ASC_KEY_ID / ASC_ISSUER_ID /
# ASC_PRIVATE_KEY (the .p8 file contents, pasted as-is; base64 also
# accepted) / APPLE_TEAM_ID. Optional variable IOS_BUNDLE_ID (default
# no.hideout.zremote). See docs/TESTFLIGHT.md.
#
# Manual distribution retains the existing device-only archive. Compile mode is
# a separate reusable job with no signing environment or secrets. Shared Skip
# core preparation creates XCFramework slices needed by package resolution;
# only the iOS device app is archived for TestFlight.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Compile only, or archive and upload to TestFlight"
        type: choice
        required: true
        default: testflight
        options:
          - compile
          - testflight
      platform:
        description: "Platform for compile mode (ignored for TestFlight)"
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
          - both
      save_debug_apk:
        description: "Compile mode: save debug APK for local testing (one day)"
        type: boolean
        required: false
        default: false
      notes:
        description: "Release notes (informational only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'compile' && format('compile-{0}-{1}', inputs.platform, github.ref) || 'testflight' }}
  cancel-in-progress: false

jobs:
  compile:
    if: inputs.operation == 'compile'
    uses: ./.github/workflows/ios-compile.yml
    with:
      platform: ${{ inputs.platform }}
      save_debug_apk: ${{ inputs.save_debug_apk }}

  testflight:
    if: inputs.operation == 'testflight'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 120
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'no.hideout.zremote' }}
    steps:
      - uses: actions/checkout@v4

      - name: Record revision
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          {
            echo "## TestFlight revision"
            echo "- SHA: \`$sha\`"
            echo "- Subject: $subject"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Bundle id: \`$BUNDLE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Archiving $short — $subject"

      - name: Check required secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            val="${!name:-}"
            if [ -z "$val" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required repository secrets:$missing"
            echo "Configure them under Settings → Secrets and variables → Actions (docs/TESTFLIGHT.md)."
            exit 1
          fi

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1 { print $2 }')
          case "$ver" in
            26*) ;;
            *)
              echo "Xcode 26 is required. Found Xcode $ver."
              exit 1
              ;;
          esac
          if ! xcodebuild -showsdks | grep -q iphoneos; then
            echo "iOS SDK is not installed; downloading the iOS platform."
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks | grep -E "iphoneos|iOS" || true

      - name: Install pinned Skip and Rust toolchain
        run: |
          set -euo pipefail
          bash scripts/install-ci-skip.sh
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          echo "CARGO_TARGET_DIR=$HOME/.cache/ZRemote/cache/cargo" >> "$GITHUB_ENV"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          rustup target list --installed

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-core-mobile-dist
          workspaces: "native/core -> ${{ env.CARGO_TARGET_DIR }}"
          cache-on-failure: true

      - name: Build native client core and verify acknowledgements
        env:
          CONFIGURATION: Release
        run: |
          bash scripts/build-native-core.sh ios
          xcodebuild -resolvePackageDependencies -workspace Project.xcworkspace \
            -scheme "ZRemote App" -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages"
          resolved="Project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          python3 scripts/generate-swift-notices.py --resolved "$resolved" \
            --checkouts "$RUNNER_TEMP/swift-packages/checkouts" --output Sources/ZRemote/Resources
          python3 scripts/verify-notices.py --required swift,cargo --resolved "$resolved"

      - name: App Store Connect key and build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey.p8"
          case "$ASC_PRIVATE_KEY" in
            *"-----BEGIN "*) printf '%s\n' "$ASC_PRIVATE_KEY" > "$key" ;;
            *)
              if ! printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$key" 2>/dev/null; then
                printf '%s' "$ASC_PRIVATE_KEY" | base64 -D > "$key"
              fi
              ;;
          esac
          chmod 600 "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "ASC_PRIVATE_KEY is not a valid .p8"; exit 1; }

          python3 -m pip install --quiet 'PyJWT[crypto]' \
            || python3 -m pip install --quiet --user --break-system-packages 'PyJWT[crypto]'

          token_path="$RUNNER_TEMP/asc/token"
          mint_token() {
            python3 - "$key" "$ASC_KEY_ID" "$ASC_ISSUER_ID" > "$token_path" <<'PY'
          import sys
          import time
          import jwt

          key_path, key_id, issuer_id = sys.argv[1:]
          with open(key_path, "rb") as key_file:
              private_key = key_file.read()
          now = int(time.time())
          print(jwt.encode(
              {"iss": issuer_id, "iat": now, "exp": now + 1199, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          ))
          PY
            chmod 600 "$token_path"
          }
          mint_token

          api() {
            curl --globoff --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $(cat "$token_path")" \
              -H "Content-Type: application/json" "$1"
          }

          apps="$RUNNER_TEMP/asc/apps.json"
          api "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=${BUNDLE_ID}&fields[apps]=name,bundleId&limit=10" > "$apps"
          app_count="$(jq '.data | length' "$apps")"
          if [ "$app_count" -ne 1 ]; then
            echo "Expected exactly one App Store Connect app for ${BUNDLE_ID}; found ${app_count}." >&2
            jq -r '.errors[]? | "\(.status) \(.code): \(.title) — \(.detail)"' "$apps" >&2 || true
            exit 3
          fi
          app_id="$(jq -r '.data[0].id' "$apps")"
          app_name="$(jq -r '.data[0].attributes.name' "$apps")"

          url="https://api.appstoreconnect.apple.com/v1/builds?filter[app]=${app_id}&fields[builds]=version&limit=200"
          latest=0
          pages=0
          while [ -n "$url" ] && [ "$pages" -lt 10 ]; do
            builds="$RUNNER_TEMP/asc/builds-${pages}.json"
            api "$url" > "$builds"
            page_max="$(jq -r '[.data[].attributes.version | select(test("^[0-9]+$")) | tonumber] | max // 0' "$builds")"
            if [ "$page_max" -gt "$latest" ]; then latest="$page_max"; fi
            url="$(jq -r '.links.next // empty' "$builds")"
            pages=$((pages + 1))
          done

          build_number=$((latest + 1))
          if [ "$build_number" -lt "${{ github.run_number }}" ]; then
            build_number="${{ github.run_number }}"
          fi

          echo "AC_KEY_PATH=$key" >> "$GITHUB_ENV"
          echo "AC_TOKEN_PATH=$token_path" >> "$GITHUB_ENV"
          echo "ASC_APP_ID=$app_id" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          {
            echo "- App: $app_name (\`$app_id\`)"
            echo "- Build number: \`$build_number\` (highest existing build: $latest)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Preparing TestFlight build $build_number of $BUNDLE_ID ($app_name) from $GITHUB_SHA."

      - name: Archive (unsigned)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Unsigned on purpose: Automatic archive on Xcode 26 still asks
          # for Apple Development certs/profiles. -allowProvisioningUpdates
          # then mints a new development cert on each runner until the
          # team's 3-certificate cap. Export (below) is the only step that
          # talks to Apple for signing — it reuses the one cloud-managed
          # Distribution cert.
          # The core preparation step uses the mobile-dist Cargo profile.
          python3 scripts/run-local.py --phase ios -- \
            xcodebuild -workspace Project.xcworkspace -scheme "ZRemote App" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZRemote.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" SKIP_ACTION=none \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive 2>&1 | tee build.log || {
              grep -E "error:|error\[|fatal error|ld: " build.log | tail -80 || true
              exit 1
            }

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export + upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log || {
              grep -E "error:|error\[|fatal error|ld: " export.log | tail -80 || true
              exit 1
            }

      - name: Verify App Store Connect processing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mint_token() {
            python3 - "$AC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID" > "$AC_TOKEN_PATH" <<'PY'
          import sys
          import time
          import jwt

          key_path, key_id, issuer_id = sys.argv[1:]
          with open(key_path, "rb") as key_file:
              private_key = key_file.read()
          now = int(time.time())
          print(jwt.encode(
              {"iss": issuer_id, "iat": now, "exp": now + 1199, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          ))
          PY
            chmod 600 "$AC_TOKEN_PATH"
          }

          builds="$RUNNER_TEMP/asc/processing-builds.json"
          # 60 * 30s = 30 minutes. Refresh the 20-minute API token along the way.
          for attempt in $(seq 1 60); do
            if [ $((attempt % 20)) -eq 1 ]; then
              mint_token
            fi
            curl --globoff --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $(cat "$AC_TOKEN_PATH")" \
              -H "Content-Type: application/json" \
              "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$ASC_APP_ID&fields[builds]=version,uploadedDate,processingState,expired,minOsVersion&sort=-uploadedDate&limit=20" \
              > "$builds"
            state="$(jq -r --arg version "$BUILD_NUMBER" '[.data[] | select(.attributes.version == $version)][0].attributes.processingState // "NOT_FOUND"' "$builds")"
            echo "Build $BUILD_NUMBER processing state: $state"
            case "$state" in
              VALID)
                jq -c --arg version "$BUILD_NUMBER" '.data[] | select(.attributes.version == $version) | {id, version: .attributes.version, uploadedDate: .attributes.uploadedDate, processingState: .attributes.processingState, expired: .attributes.expired, minOsVersion: .attributes.minOsVersion}' "$builds"
                {
                  echo "- Processing: VALID"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED|INVALID)
                echo "App Store Connect rejected build $BUILD_NUMBER with state $state." >&2
                jq -c --arg version "$BUILD_NUMBER" '.data[] | select(.attributes.version == $version)' "$builds" >&2 || true
                exit 4
                ;;
            esac
            sleep 30
          done
          echo "Build $BUILD_NUMBER did not finish processing within 30 minutes." >&2
          exit 5

      - name: Cleanup key material + guard logs
        if: always()
        run: |
          # Belt and braces: the logs must never contain key material. If
          # they do, delete them so the artifact upload below has nothing
          # to leak, then fail the job loudly.
          if grep -lE "BEGIN (EC |RSA )?PRIVATE KEY" build.log export.log 2>/dev/null; then
            echo "Log file contains key material — deleting logs and failing."
            rm -f build.log export.log
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/asc"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            build.log
            export.log
          if-no-files-found: ignore
